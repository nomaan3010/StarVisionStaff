name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use logo.png as the app icon (if present)
        run: |
          if [ -f logo.png ]; then
            sudo apt-get update -y && sudo apt-get install -y imagemagick
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              for n in ic_launcher ic_launcher_round; do
                convert logo.png -resize ${s}x${s} -background white -gravity center -extent ${s}x${s} -flatten app/src/main/res/mipmap-$d/$n.png
              done
            done
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: StarVisionStaff-APK
          path: app/build/outputs/apk/debug/app-debug.apk
